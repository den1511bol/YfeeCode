# YfeeCode — developer: @yfeeeee
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Chaquopy needs a Python on the build machine to run pip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # proot + libs from the Termux repo, packed as native libraries for the on-device Linux (never fails the build)
      - name: Fetch proot for on-device Linux
        continue-on-error: true
        run: |
          set -e
          base=https://packages.termux.dev/apt/termux-main
          curl -fsSL $base/dists/stable/main/binary-aarch64/Packages -o /tmp/Packages
          out=app/src/main/jniLibs/arm64-v8a
          mkdir -p /tmp/deb $out
          for p in proot libtalloc libandroid-shmem; do
            f=$(awk -v p="$p" '$0=="Package: "p{f=1} f&&/^Filename:/{print $2; exit}' /tmp/Packages)
            echo "$p -> $f"
            curl -fsSL "$base/$f" -o /tmp/deb/$p.deb
            mkdir -p /tmp/deb/$p
            (cd /tmp/deb/$p && ar x ../$p.deb && tar xf data.tar.*)
          done
          find /tmp/deb -type f \( -name proot -o -name loader -o -name 'libtalloc.so*' -o -name 'libandroid-shmem.so*' \) -exec ls -l {} \;
          cp "$(find /tmp/deb/proot -type f -name proot | head -1)" $out/libproot.so
          cp "$(find /tmp/deb/proot -type f -name loader | head -1)" $out/libproot-loader.so
          cp "$(find /tmp/deb/libtalloc -type f -name 'libtalloc.so*' | head -1)" $out/libtalloc.so
          cp "$(find /tmp/deb/libandroid-shmem -type f -name 'libandroid-shmem.so*' | head -1)" $out/libandroid-shmem.so
          ls -l $out

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: YfeeCode-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK (release + apk branch)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/YfeeCode.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest /tmp/YfeeCode.apk --title "YfeeCode (latest build)" \
            --notes "Debug APK, developer @yfeeeee. Commit: ${{ github.sha }}"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apk
          git rm -rf . > /dev/null
          cp /tmp/YfeeCode.apk YfeeCode.apk
          git add YfeeCode.apk
          git commit -m "APK for ${{ github.sha }}"
          git push -f origin apk
