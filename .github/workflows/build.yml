# YfeeCode — developer: @yfeeeee
name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Chaquopy needs a Python on the build machine to run pip
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: YfeeCode-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Publish APK (release + apk branch)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/YfeeCode.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest /tmp/YfeeCode.apk --title "YfeeCode (latest build)" \
            --notes "Debug APK, developer @yfeeeee. Commit: ${{ github.sha }}"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan apk
          git rm -rf . > /dev/null
          cp /tmp/YfeeCode.apk YfeeCode.apk
          git add YfeeCode.apk
          git commit -m "APK for ${{ github.sha }}"
          git push -f origin apk
