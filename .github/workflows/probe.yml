# YfeeCode probe — developer: @yfeeeee. Manual experiment.
name: Probe proot
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Termux terminal library on jitpack
        run: |
          for a in terminal-view terminal-emulator; do
            for v in v0.118.0 v0.118.1 0.118.0; do
              code=$(curl -s -o /tmp/p.pom -w "%{http_code}" "https://jitpack.io/com/github/termux/termux-app/$a/$v/$a-$v.pom" || true)
              echo "$a $v -> $code"
            done
          done
          curl -s "https://jitpack.io/api/builds/com.github.termux.termux-app/terminal-view" | head -c 400 || true
