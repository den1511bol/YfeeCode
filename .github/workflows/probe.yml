# YfeeCode probe — developer: @yfeeeee. Manual experiment: can we fetch proot + rootfs for on-device Linux?
name: Probe proot
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Termux proot package index
        run: |
          set -x
          curl -fsSL https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages -o Packages || true
          ls -l Packages || true
          awk '/^Package: (proot|libtalloc|libandroid-glob|libandroid-support)$/{p=1} p{print} /^$/{p=0}' Packages | grep -E "^(Package|Version|Filename|Depends|Size)" || true
      - name: Alpine rootfs
        run: |
          curl -fsSIL https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/aarch64/ | head -3 || true
          curl -fsSL https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/aarch64/latest-releases.yaml | grep -E "minirootfs" -A3 | head -12 || true
